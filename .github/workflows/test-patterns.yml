name: Swing pattern tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas 'altair>=5.0'
      - name: Compile application and detector
        run: python -m py_compile app.py swing_patterns.py
      - name: Run pattern tests
        run: python -m unittest discover -s tests -v
